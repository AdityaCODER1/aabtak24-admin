name: Deploy Aabtak24 Editor Worker

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'wrangler.toml'
      - 'package.json'
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Worker security & API tests
        run: npm test

      - name: Check Cloudflare deploy credentials
        id: check-cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Cloudflare deploy (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not configured yet)."
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.check-cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
