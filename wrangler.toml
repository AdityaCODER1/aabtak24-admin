name = "aabtak24-editor"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Serve the static CMS UI from ./public on the exact same origin as /api/*
# run_worker_first = true ensures every HTML/asset response receives strict HTTP security headers (CSP, HSTS, X-Frame-Options)
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Custom Domain route (activates automatically once aabtak24.in DNS is on Cloudflare)
routes = [
  { pattern = "editor.aabtak24.in", custom_domain = true }
]

# Private Cloudflare D1 SQLite database for Admin auth, Editors, Sessions, Rate Limits, and Audit Logs
[[d1_databases]]
binding = "CMS_DB"
database_name = "aabtak24-cms"
database_id = "936dfc16-195f-4487-a16e-c30e2df48ed9"

[vars]
GITHUB_REPO = "AdityaCODER1/auto-news-bot"
GITHUB_BRANCH = "main"
ALLOWED_ORIGIN = "https://editor.aabtak24.in"
